name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Régénérer la page autonome
        run: node tools/build-artifact.js
      # Seuls les fichiers du site : le dépôt porte aussi le projet Android,
      # les outils et les tests, qui n'ont rien à faire en ligne.
      - name: Rassembler le site
        run: |
          mkdir -p _site/assets _site/dist
          cp index.html simulateur.html comprendre.html .nojekyll _site/
          cp assets/styles.css assets/site.js assets/calc.js assets/app.js assets/favicon.svg _site/assets/
          cp dist/boule-de-neige.html _site/dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
